<script>
'use strict';
// =====================================================================
//  ORION’S SPACE ADVENTURE
// =====================================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pickW=(arr)=>{let s=0;for(const a of arr)s+=a[1];let r=Math.random()*s;for(const a of arr){r-=a[1];if(r<=0)return a[0];}return arr[0][0];};
function hash(i){let h=Math.imul((i|0)^0x5bd1e995,0x27d4eb2d);h^=h>>>15;h=Math.imul(h,0x85ebca6b);h^=h>>>13;return (h>>>0)/4294967296;}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const safeDiv=document.getElementById('safe');
let W=960;const H=540;let SC=1,DPR=1,offX=0,offY=0,portrait=false,SAFE_L=0,SAFE_R=0;
const ML=()=>Math.max(18,SAFE_L+10), MR=()=>Math.max(18,SAFE_R+10);
function resize(){
  const vw=window.innerWidth||960, vh=window.innerHeight||540;
  portrait=vh>vw*1.05;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=Math.round(clamp(H*vw/vh,720,1200));
  SC=Math.min(vw/W,vh/H);
  offX=(vw-W*SC)/2; offY=(vh-H*SC)/2;
  cv.width=Math.round(vw*DPR); cv.height=Math.round(vh*DPR);
  cv.style.width=vw+'px'; cv.style.height=vh+'px';
  try{const cs=getComputedStyle(safeDiv);
    SAFE_L=Math.max(0,(parseFloat(cs.paddingLeft)||0)-offX)/SC;
    SAFE_R=Math.max(0,(parseFloat(cs.paddingRight)||0)-offX)/SC;}catch(e){}
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();

// ---------------------------------------------------------------- SAVE
const SAVE_KEY='fascinating_spacecraft_v2';const SAVE_VER=3;
const CREDIT='Maximilian Grand';
const VERSION='1.0';
function freshSave(){return {ver:SAVE_VER,chU:0,hchU:0,mp:{},hmp:{},stars:{},score:{},beat:false,endless:0,up:{hp:0,kry:0,kick:0},board:0,ach:{},set:{music:true,sfx:true,easy:false,vib:true,lefty:false,fx:true}};}
let save=freshSave();
try{let s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  if(!s){const o=JSON.parse(localStorage.getItem('fascinating_spacecraft_v1')||'null');if(o){s={unlocked:(o.unlocked||0)>=2?o.unlocked+1:(o.unlocked||0),stars:{},score:{},beat:!!o.beat,endless:o.endless||0,set:o.set};for(const k in (o.stars||{})){const i=+k;s.stars[i>=2?i+1:i]=o.stars[k];}}}
  if(s){const set=Object.assign({},save.set,s.set||{}),up=Object.assign({},save.up,s.up||{});save=Object.assign(save,s);save.set=set;save.up=up;save.ach=save.ach||{};save.board=save.board||0;
    if(s.mp===undefined){save.chU=Math.min(8,s.unlocked||0);save.hchU=0;save.mp={};save.hmp={};save.stars={};save.score={};}delete save.unlocked;
    if(s.ver!==SAVE_VER){const f=freshSave();save.chU=0;save.hchU=0;save.mp={};save.hmp={};save.stars={};save.score={};save.beat=false;save.up=f.up;save.ach={};save.board=0;save.ver=SAVE_VER;}}}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const UPG=[{id:'hp',n:'Tough Jacket',d:'More health in every mission',cost:[3,5,8,12,16]},{id:'kry',n:'Krystal Tank',d:'Powers recharge 20% faster per level',cost:[3,5,8,12,16]},{id:'kick',n:'Super Boots',d:'Super kicks and dashes hit harder',cost:[3,5,8,12,16]}];
const BOARDS=[{n:'Classic',b:'#e94f37',t:'#ffd23f',s:'#e8324a',need:0},{n:'Comet',b:'#18b8d8',t:'#ffffff',s:'#38e0ff',need:6},{n:'Jungle',b:'#3fbf5a',t:'#1a3a20',s:'#7af07a',need:14},{n:'Royal',b:'#7a4cff',t:'#ffcb33',s:'#c9a8ff',need:24},{n:'Solar',b:'#ffcb33',t:'#e8324a',s:'#ffe14a',need:36},{n:'Galaxy',b:'#2a1a6a',t:'#c9a8ff',s:'#8a5cff',need:50},{n:'Ember',b:'#ff6a2a',t:'#2a1010',s:'#ffb347',need:70},{n:'Ghost',b:'#e8eef8',t:'#7ff6ff',s:'#ffffff',need:100},{n:'Admiral',b:'#1a1a2a',t:'#ffcb33',s:'#ffcb33',need:140}];
const ACH=[{id:'first',n:'Lights Out',d:'Finish Chapter 1'},{id:'mid',n:'Halfway Home',d:'Finish Chapter 3'},{id:'mini',n:'Big Trouble',d:'Defeat a mini-boss'},{id:'hundred',n:'Star Power',d:'Earn 100 stars'},{id:'hard',n:'Admiral’s Bane',d:'Finish the story in Admiral Mode'},{id:'ghost',n:'Ghost of Nebula',d:'Reach the camp without being spotted'},{id:'combo',n:'Combo King',d:'Land a 12-hit combo'},{id:'reflect',n:'Return to Sender',d:'Kick 5 blaster shots back in one mission'},{id:'ships',n:'Rock Star',d:'Win Boulder Toss without getting hit'},{id:'boss',n:'World Saver',d:'Defeat the Admiral and his mech'},{id:'flawless',n:'Untouchable',d:'Finish any mission without losing health'},{id:'rush',n:'Krystal Rusher',d:'Run 1,000 m in Krystal Rush'},{id:'stars',n:'Star Collector',d:'Earn 3 stars on every mission'}];
function starsEarned(){let n=0;for(const k in save.stars)n+=save.stars[k]||0;return n;}
function starsSpent(){let n=0;for(const u of UPG)for(let i=0;i<(save.up[u.id]||0);i++)n+=u.cost[i];return n;}
function style(){return BOARDS[save.board]||BOARDS[0];}
const KM=()=>1+0.2*(save.up.kry||0);
let toast=null;
function unlock(id){if(save.ach[id])return;const a=ACH.find(a=>a.id===id);if(!a)return;save.ach[id]=1;persist();toast={s:a.n,t:0};SFX.win();Native.ach(id);}

// ---------------------------------------------------------------- INPUT
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();unlockAudio();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
const pointers=new Map();
let taps=[];
let touchMode=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
function toL(cx,cy){return {x:(cx-offX)/SC,y:(cy-offY)/SC};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();if(e.pointerType==='touch')touchMode=true;const p=toL(e.clientX,e.clientY);pointers.set(e.pointerId,{x:p.x,y:p.y,sx:p.x,sy:p.y,btn:null});taps.push(p);},{passive:false});
cv.addEventListener('pointermove',e=>{const q=pointers.get(e.pointerId);if(q){const p=toL(e.clientX,e.clientY);q.x=p.x;q.y=p.y;}},{passive:false});
const pUp=e=>{pointers.delete(e.pointerId);};
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);cv.addEventListener('pointerleave',pUp);
document.addEventListener('gesturestart',e=>e.preventDefault());
let IN={l:0,r:0,u:0,d:0,j:0,k:0,s:0,t:0,p:0,ok:0};
let PR={};
let touchBtns=[];
function pollInput(){
  const n={l:0,r:0,u:0,d:0,j:0,k:0,s:0,t:0,p:0,ok:0};
  n.l=keys.ArrowLeft||keys.KeyA; n.r=keys.ArrowRight||keys.KeyD; n.u=keys.ArrowUp||keys.KeyW; n.d=keys.ArrowDown||keys.KeyS;
  n.j=keys.Space||keys.KeyZ||keys.ArrowUp||keys.KeyW; n.k=keys.KeyX||keys.KeyJ; n.s=keys.KeyC||keys.KeyK||keys.ShiftLeft; n.t=keys.KeyV||keys.KeyL;
  n.p=keys.Escape||keys.KeyP; n.ok=keys.Enter||keys.Space;
  for(const q of pointers.values()){q.btn=null;
    for(const b of touchBtns){if(b.tap)continue;const dx=q.x-b.x,dy=q.y-b.y;if(dx*dx+dy*dy<(b.r*1.22)*(b.r*1.22)){n[b.id]=1;q.btn=b.id;}}}
  try{const gps=navigator.getGamepads?navigator.getGamepads():[];for(const g of gps){if(!g)continue;const ax=g.axes[0]||0;
    if(ax<-0.4||(g.buttons[14]&&g.buttons[14].pressed))n.l=1; if(ax>0.4||(g.buttons[15]&&g.buttons[15].pressed))n.r=1;
    const ay=g.axes[1]||0; if(ay<-0.4||(g.buttons[12]&&g.buttons[12].pressed))n.u=1; if(ay>0.4||(g.buttons[13]&&g.buttons[13].pressed))n.d=1;
    const B=i=>g.buttons[i]&&g.buttons[i].pressed; if(B(0)){n.j=1;n.ok=1;} if(B(2))n.k=1; if(B(1)||B(5)||B(7))n.s=1; if(B(3)||B(4))n.t=1; if(B(9))n.p=1;}}catch(e){}
  for(const k in n){n[k]=n[k]?1:0;PR[k]=n[k]&&!IN[k];}
  IN=n;
}

// ---------------------------------------------------------------- AUDIO
let AC=null,master,musicGain,sfxGain,noiseBuf=null;
function unlockAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.8;const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=6;master.connect(comp);comp.connect(AC.destination);
    musicGain=AC.createGain();sfxGain=AC.createGain();musicGain.connect(master);sfxGain.connect(master);musicGain.gain.value=0.55;
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    leadBus=AC.createGain();leadBus.connect(musicGain);const dl=AC.createDelay(1);dl.delayTime.value=0.27;const fb=AC.createGain();fb.gain.value=0.28;const wet=AC.createGain();wet.gain.value=0.3;leadBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(musicGain);
    initSfxBus();
    nextNote=AC.currentTime+0.1;}catch(e){AC=null;}}
  Native.gcInit();
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d,type,v,f2,delay,dest){if(!AC)return;if(!dest&&!save.set.sfx)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+d+0.03);}
function noise(d,v,freq,delay,dest,at){if(!AC||!noiseBuf)return;if(!dest&&!save.set.sfx)return;const t=at!==undefined?at:AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1200;const g=AC.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);s.connect(f);f.connect(g);g.connect(dest||sfxGain);s.start(t,Math.random()*0.5);s.stop(t+d+0.03);}
let revIn=null,sfxPan=0;
function initSfxBus(){try{const len=Math.floor(AC.sampleRate*1.6),ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const cvr=AC.createConvolver();cvr.buffer=ir;revIn=AC.createGain();const wet=AC.createGain();wet.gain.value=0.5;revIn.connect(cvr);cvr.connect(wet);wet.connect(master);}catch(e){revIn=null;}}
function outNode(g,o){let n=g;const pan=o.pan!==undefined?o.pan:sfxPan;if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);n=p;}
  n.connect(sfxGain);if(o.rev&&revIn){const s=AC.createGain();s.gain.value=o.rev;n.connect(s);s.connect(revIn);}}
function syn(o){if(!AC||!save.set.sfx)return;try{const t=AC.currentTime+(o.delay||0),d=o.d||0.2,v=o.v||0.1;
  const osc=AC.createOscillator(),g=AC.createGain();osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t);if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+d);
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=o.vibD||12;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+0.05);}
  if(o.fm){const m=AC.createOscillator(),mg=AC.createGain();m.frequency.setValueAtTime(o.f*o.fm,t);if(o.f2)m.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2*o.fm),t+d);mg.gain.setValueAtTime(o.fmD||o.f,t);mg.gain.exponentialRampToValueAtTime(1,t+d);m.connect(mg);mg.connect(osc.frequency);m.start(t);m.stop(t+d+0.05);}
  let last=osc;if(o.lp){const f=AC.createBiquadFilter();f.type=o.ft||'lowpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.lp,t);if(o.lp2)f.frequency.exponentialRampToValueAtTime(Math.max(30,o.lp2),t+d);osc.connect(f);last=f;}
  const a=Math.min(o.a||0.004,d*0.5);g.gain.setValueAtTime(0.0008,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0008,t+d);last.connect(g);outNode(g,o);osc.start(t);osc.stop(t+d+0.05);}catch(e){}}
function nz(o){if(!AC||!noiseBuf||!save.set.sfx)return;try{const t=AC.currentTime+(o.delay||0),d=o.d||0.2,v=o.v||0.2;const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=o.ft||'lowpass';f.Q.value=o.q||0.8;f.frequency.setValueAtTime(o.f||1200,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f2),t+d);
  const g=AC.createGain(),a=Math.min(o.a||0.003,d*0.5);g.gain.setValueAtTime(0.0008,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0008,t+d);s.connect(f);f.connect(g);outNode(g,o);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);}catch(e){}}
const SFX={
  jump:()=>{syn({f:260,f2:640,d:0.16,v:0.1});syn({f:520,f2:1280,d:0.12,v:0.03,type:'triangle'});nz({ft:'highpass',f:2500,d:0.08,v:0.05});},
  punch:()=>{nz({ft:'bandpass',f:1100,q:1.2,d:0.07,v:0.3});syn({f:190,f2:70,d:0.09,v:0.22});nz({ft:'highpass',f:5000,d:0.02,v:0.12});},
  kick:()=>{nz({ft:'bandpass',f:500,f2:2600,q:1.5,d:0.12,v:0.18,a:0.03});syn({f:150,f2:45,d:0.2,v:0.3,delay:0.05});nz({f:700,f2:120,d:0.16,v:0.3,delay:0.05});},
  big:()=>{nz({ft:'bandpass',f:400,f2:3600,q:2,d:0.14,v:0.22,a:0.04});syn({f:110,f2:28,d:0.5,v:0.42,delay:0.04,rev:0.4});nz({f:1400,f2:90,d:0.4,v:0.38,delay:0.04,rev:0.5});nz({ft:'highpass',f:4000,d:0.05,v:0.25,delay:0.04});syn({f:1500,f2:260,d:0.25,v:0.07,type:'sawtooth',fm:1.5,fmD:900,lp:5000,lp2:600,delay:0.04,rev:0.5});},
  dash:()=>{nz({ft:'bandpass',f:500,f2:6000,q:2.5,d:0.3,v:0.2,a:0.05,rev:0.3});syn({f:300,f2:1700,d:0.26,v:0.08,fm:2,fmD:300,rev:0.4});syn({f:1700,f2:500,d:0.2,v:0.04,delay:0.22,rev:0.4});},
  hit:()=>{nz({ft:'bandpass',f:1700,q:1,d:0.06,v:0.25});syn({f:320,f2:110,d:0.1,v:0.16,type:'triangle'});},
  hurt:()=>{syn({f:440,f2:95,d:0.3,v:0.16,type:'sawtooth',lp:2400,lp2:400,vib:28,vibD:20});nz({f:1000,f2:200,d:0.18,v:0.22});syn({f:120,f2:50,d:0.15,v:0.2});},
  boom:()=>{syn({f:120,f2:24,d:0.95,v:0.45,rev:0.5});nz({f:1600,f2:70,d:1.0,v:0.45,rev:0.7});nz({ft:'highpass',f:3000,d:0.06,v:0.3});for(let i=0;i<5;i++)nz({ft:'bandpass',f:rnd(600,2400),q:3,d:0.07,v:0.14,delay:0.12+i*0.09+rnd(0.04),rev:0.5});},
  pick:()=>{syn({f:988,d:0.16,v:0.09,fm:3.5,fmD:700,rev:0.4});syn({f:1480,d:0.28,v:0.09,fm:3.5,fmD:900,delay:0.07,rev:0.5});},
  laser:()=>{syn({f:1900,f2:240,d:0.2,v:0.08,type:'sawtooth',lp:6000,lp2:700,fm:0.5,fmD:500});nz({ft:'highpass',f:3500,d:0.05,v:0.08});},
  beam:()=>{syn({f:92,f2:60,d:0.5,v:0.2,type:'sawtooth',lp:300,lp2:2600});syn({f:95.5,f2:62,d:0.5,v:0.18,type:'sawtooth',lp:300,lp2:2600});nz({ft:'bandpass',f:3000,f2:800,q:2,d:0.45,v:0.14,rev:0.4});},
  lift:()=>{syn({f:150,f2:420,d:0.25,v:0.14,type:'triangle'});nz({f:300,d:0.25,v:0.2});},
  throw:()=>{nz({ft:'bandpass',f:2600,f2:500,q:2,d:0.24,v:0.22,a:0.03});syn({f:600,f2:180,d:0.2,v:0.06});},
  clank:()=>{for(const [fr,v] of [[540,0.1],[1490,0.07],[2920,0.04]])syn({f:fr,d:0.22,v,type:'square',fm:2.76,fmD:fr*1.5,lp:7000,rev:0.5});nz({ft:'highpass',f:4500,d:0.03,v:0.2});},
  nope:()=>{syn({f:150,d:0.09,v:0.1,type:'square',lp:900});syn({f:112,d:0.14,v:0.1,type:'square',lp:900,delay:0.1});},
  out:()=>{syn({f:620,f2:60,d:0.7,v:0.14,type:'sawtooth',lp:3000,lp2:150,vib:9,vibD:30,rev:0.4});},
  power:()=>{[0,7,12,19].forEach((n,i)=>syn({f:330*Math.pow(2,n/12),d:0.3,v:0.08,fm:2,fmD:400,delay:i*0.06,rev:0.5}));nz({ft:'highpass',f:1200,f2:9000,d:0.5,v:0.1,a:0.3,rev:0.5});syn({f:80,f2:240,d:0.5,v:0.2});},
  select:()=>{syn({f:880,d:0.05,v:0.07,type:'triangle',pan:0});syn({f:1320,d:0.07,v:0.05,type:'triangle',delay:0.03,pan:0});},
  win:()=>{[0,4,7,12,16].forEach((n,i)=>{syn({f:523*Math.pow(2,n/12),d:0.4,v:0.08,type:'square',lp:3200,delay:i*0.1,rev:0.5,pan:0});syn({f:1046*Math.pow(2,n/12),d:0.3,v:0.04,fm:3,fmD:600,delay:i*0.1,rev:0.5,pan:0});});},
  lose:()=>{[7,3,0,-5].forEach((n,i)=>syn({f:392*Math.pow(2,n/12),d:0.5,v:0.12,type:'triangle',delay:i*0.18,vib:6,vibD:5,rev:0.6,pan:0}));},
  type:()=>syn({f:1000+Math.random()*300,d:0.03,v:0.025,type:'square',lp:3000,pan:0}),
  alert:()=>{for(let i=0;i<3;i++){syn({f:980,d:0.1,v:0.12,type:'square',lp:3500,delay:i*0.16});syn({f:740,d:0.08,v:0.1,type:'square',lp:3500,delay:i*0.16+0.08});}},
  rocket:()=>{syn({f:1500,f2:320,d:0.95,v:0.07,type:'triangle',vib:22,vibD:30});nz({ft:'bandpass',f:1800,f2:600,q:3,d:0.9,v:0.08});},

let curSong=null,nextNote=0,stepN=0,leadBus=null;

const midi=m=>440*Math.pow(2,(m-69)/12);
function mNote(f,d,type,v,t,att,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;att=att||0.008;g.gain.setValueAtTime(0.0008,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.setValueAtTime(v,t+Math.max(att,d*0.55));g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(dest||musicGain);o.start(t);o.stop(t+d+0.02);}
function musicTick(){
  if(!AC||!curSong)return;
  if(!save.set.music){nextNote=AC.currentTime+0.05;return;}
  const s=SONGS[curSong];const spb=60/s.bpm/4;
  if(nextNote<AC.currentTime-0.3)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.16){
    const t=nextNote,i=stepN,st=i%16,barN=Math.floor(i/16),ch=s.prog[barN%s.prog.length],root=s.key+ch[0];
    const sec=s.form[Math.floor(barN/4)%s.form.length];
    if(s.drive){if(st%2===0)mNote(midi(root-12+(st%8===6?12:0)),spb*1.6,'triangle',0.2,t);}
    else if(st===0||st===8)mNote(midi(root-12),spb*6,'triangle',0.2,t);
    if(s.growl&&st%4===0)mNote(midi(root-24),spb*3,'sawtooth',0.06,t);
    if(st===0&&s.pad){for(const iv of [0,ch[1],7])mNote(midi(root+12+iv),spb*15.5,'sine',s.pad,t,0.09);}
    if(s.arp&&st%2===0){const a=s.arp[(i/2)%s.arp.length];mNote(midi(root+12+[0,ch[1],7,12][a]),spb*0.9,'square',s.arpV||0.012,t);}
    if(st%2===0){const M=s.mel[sec],m=M[((barN%4)*8+st/2)%M.length];if(m)mNote(midi(s.key+s.oct+m.n),spb*2*m.len*0.94,s.wave||'square',s.lead,t,0.012,leadBus);}
    if((s.kick===1&&st%4===0)||(s.kick===2&&(st===0||st===6||st===8))){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.16);}
    if(s.snare&&st%8===4)noise(0.12,0.18,2500,0,musicGain,t);
    if(s.hat===2||(s.hat&&st%2===1))noise(0.03,st%2?0.06:0.03,8000,0,musicGain,t);
    nextNote+=spb;stepN++;
  }
}

function puff(x,y,n,col){for(let i=0;i<n;i++)FX.parts.push({x:x+rnd(-20,20),y:y+rnd(-6,6),vx:rnd(-80,80),vy:rnd(-60,-10),life:rnd(0.4,0.8),max:0.8,col:col||'rgba(220,200,180,0.6)',size:rnd(6,12),grav:-40,soft:1});}
function floatText(x,y,s,col,sz){FX.texts.push({x,y,s,col:col||'#fff',t:0,sz:sz||26});}
function updFX(dt){updGfx(dt);for(let i=FX.parts.length-1;i>=0;i--){const p=FX.parts[i];p.life-=dt;if(p.life<=0){FX.parts.splice(i,1);continue;}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=FX.texts.length-1;i>=0;i--){const t=FX.texts[i];t.t+=dt;t.y-=50*dt;if(t.t>0.9)FX.texts.splice(i,1);}
  if(FX.shake>0)FX.shake=Math.max(0,FX.shake-dt*40);if(FX.flash>0)FX.flash=Math.max(0,FX.flash-dt*2.2);

function banner(text,sub,dur){FX.banner={text,sub:sub||'',t:0,dur:dur||2.2};}
function drawBanner(){const b=FX.banner;if(!b)return;const k=Math.min(1,b.t*5)*Math.min(1,(b.dur-b.t)*4);ctx.save();ctx.globalAlpha=clamp(k,0,1);
  const y=H*0.3;ctx.fillStyle='rgba(10,6,30,0.72)';ctx.fillRect(0,y-46,W,b.sub?100:84);
  ctx.fillStyle='#7ff6ff';ctx.fillRect(0,y-46,W,3);ctx.fillRect(0,y+(b.sub?51:35),W,3);

function bright(c){if(typeof c!=='string'||c[0]!=='#'||c.length!==7)return 0;const n=parseInt(c.slice(1),16);return ((n>>16)*0.3+((n>>8)&255)*0.59+(n&255)*0.11)>150?1:0;}

function impact(x,y,size,col){FX.stars.push({x,y,size,col:col||'#fff',t:0,life:0.16,rot:rnd(TAU)});}

function explode(x,y,s){ring(x,y,10*s,130*s,0.45,'#fff2c0',7);ring(x,y,6*s,84*s,0.6,'#ff8a3a',4);impact(x,y,70*s,'#ffffff');burst(x,y,Math.round(22*s),'#ffb347',420*s,0.7,6);burst(x,y,Math.round(10*s),'#fff6c0',560*s,0.4,4);

function drawGfx(){

  btns(){return [{id:'k',x:W-MR()-110,y:H-110,r:80,lab:'KEY'}];}

    else if(this.down!==null){const s=this.down>=this.dashT?'-':'.';this.down=null;beepOff();this.add(s);}

  add(s){const w=this.words[this.wi],ch=w[this.ci],code=MORSE[ch];this.sym+=s;

  draw(){bgCave();grnd('#3a2014','#1a0c08',H-70);glow(W*0.82,H*0.35,120,'255,200,120',0.2);

      if(i===this.ci&&!this.done){const code=MORSE[ch];let sx=W/2-code.length*24;for(let k=0;k<code.length;k++){const on=k<this.sym.length;const c=on?'#5af07a':'#fff';if(code[k]==='.')circ(sx+k*48+24,220,10,c);else{rrect(sx+k*48+6,213,36,14,7);ctx.fillStyle=c;ctx.fill();}}}x+=cw;}
    txt('Short tap = dot      Hold = dash',W/2,268,16,'#d8d0ff','center',800);
    const pw=this.down===null?0:clamp(this.down/this.dashT,0,1);hudBar(pw,W/2-100,300,200,12,pw>=1?'#ffb347':'#7ff6ff',pw>=1?'DASH':'DOT');
    drawFig(PAL.orion,W*0.3,H-70,1,POSE.walkie(this.t));if(this.down!==null)glow(W*0.3+20,H-150,40,'110,240,255',0.6);

    for(const n of this.notes){if(n.done&&!n.m)continue;const d=(n.b-nowB)*this.beat;if(d>this.lead||d<-0.3)continue;const y=hy-(d/this.lead)*(hy-H*0.46);const x=this.lx(n.lane);circ(x,y,30,OUTC);circ(x,y,25,n.m?'#5a5a6a':['#ff5a8a','#ffe14a','#5af0c0'][n.lane]);}

let story=null;
function runStory(panels,done,song){if(!panels||!panels.length){done();return;}story={panels,i:0,t:0,done};scene='story';playSong(song||'story');}
function updStory(dt){const s=story;s.t+=dt;const pn=s.panels[s.i];const full=pn[1].length;const shown=Math.floor(s.t*48);
  if(shown<full&&Math.floor((s.t-dt)*48)<shown&&shown%3===0)SFX.type();
  let adv=PR.j||PR.k||PR.ok;let skip=PR.p;
  for(const tp of taps){if(tp.x>W-MR()-150&&tp.y<70)skip=true;else adv=true;}
  if(skip){SFX.select();story=null;s.done();return;}
  if(adv){if(shown<full)s.t=full/48+0.01;else{s.i++;s.t=0;SFX.select();if(s.i>=s.panels.length){story=null;s.done();}}}}

  if(shown.length>=pn[1].length&&Math.floor(T*3)%2)txt('▶',x+w-22,y+h-16,18,OUTC,'center',900);

const mpc=c=>STAGES[c].ms.length;
let MIS=null,curM=0,curH=false,selCh=0,selH=false;
function buildMission(c,m,h){const d=STAGES[c].ms[m];const M=Object.assign({},d.cfg||{});
  M.name=d.name;M.desc=d.desc;M.how=d.how;M.eng=d.eng;M.v=d.v;M.song=d.song;M.bt=d.bonus[0];M.bf=d.bonus[1];M.pre=d.pre;M.c=c;M.m=m;M.h=!!h;M.type=d.eng;
  M.diff=clamp(c*0.08+m*0.025,0,1)+(h?0.35:0);
  if(h){if(M.len)M.len=Math.round(M.len*1.2);if(M.nw)M.nw+=1;if(M.bands)M.bands+=2;if(M.need)M.need=Math.round(M.need*1.3);if(M.caveT)M.caveT+=10;}
  M.dmgMul=h?1.5:1;M.hpAdj=h?-2:0;M.ehp=(1+0.4*M.diff)*(h?1.25:1);return M;}
function genWaves(M){const out=[];let x=420;
  for(let i=0;i<M.nw;i++){const n=Math.round(M.base+i*M.grow+(M.h?1:0));const list=[];for(let k=0;k<n;k++)list.push(pickW(M.pool));
    if(M.mini&&i===M.nw-1)list.push(M.mini);out.push({x,list});x+=1000;}
  return {waves:out,end:x};}
const mKey=(c,m,h)=>(h?'h':'')+c+'-'+m;
const mpOf=h=>h?(save.hmp=save.hmp||{}):(save.mp=save.mp||{});
function chOpen(c,h){return h?(save.beat&&c<=(save.hchU||0)):c<=(save.chU||0);}
function misOpen(c,m,h){return chOpen(c,h)&&m<=(mpOf(h)[c]||0);}
function nextMission(h){for(let c=0;c<STAGES.length;c++){const n=mpOf(h)[c]||0;if(chOpen(c,h)&&n<mpc(c))return [c,n];}return null;}
function chStars(c,h){let n=0;for(let m=0;m<mpc(c);m++)n+=save.stars[mKey(c,m,h)]||0;return n;}
function fmtT(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function chalText(M){return M?(M.bt||''):'';}
function chalOK(){const M=MIS,g=game;if(!M||!g||!M.bf)return false;try{return !!M.bf(g);}catch(e){return false;}}
const ENG={catch:Catch,climb:Climb,circuit:Circuit,moons:Moons,tune:Tune,frogger:Frogger,lander:Lander,breath:Breath,mash:Mash,dodge:Dodge,memory:Memory,pathrun:PathRun,whack:Whack,morse:Morse,aim:AimThrow,heat:HeatClimb,cards:Cards,rhythm:Rhythm,shooter:Shooter,zerog:ZeroG};
function mkGame(M){if(M.eng==='brawl')return new Brawl(M.v);if(M.eng==='runner')return new Runner(M.v);if(M.eng==='sneak')return new Sneak();if(M.eng==='space')return new Space(M.v);return new ENG[M.eng]();}

function beginPlay(i,m,h,res){m=m||0;h=!!h;cur=i;curM=m;curH=h;MIS=buildMission(i,m,h);if(res)MIS.resume=res;resetFX();const S=STAGES[i];game=mkGame(MIS);scene='play';paused=false;playSong(MIS.song||'fight');banner(S.ch+'  •  MISSION '+(m+1)+'/'+mpc(i),MIS.name+(h?'  (Admiral Mode)':''),2.4);
  if(res)banner('CHECKPOINT','Back at the halfway point',1.6);else if(game instanceof Mini)game.tip={s:MIS.how+'   Bonus ★: '+MIS.bt,t:0};else if(!game.tip)game.tip={s:(MIS.how||MIS.desc)+'   Bonus ★: '+MIS.bt,t:0};}
function beginEndless(){cur=-1;MIS=null;resetFX();game=new Runner('endless');scene='play';paused=false;playSong('run');banner('KRYSTAL RUSH','Endless mode',2);}
function stageWon(hpFrac,score,endless){let stars=0,ch=false;
  if(cur>=0&&MIS){ch=chalOK();stars=1+(hpFrac>=0.5?1:0)+(ch?1:0);const k=mKey(cur,curM,curH);
    save.stars[k]=Math.max(save.stars[k]||0,stars);save.score[k]=Math.max(save.score[k]||0,Math.floor(score));
    const mp=mpOf(curH);mp[cur]=Math.max(mp[cur]||0,curM+1);
    if(curM===mpc(cur)-1){if(curH)save.hchU=Math.max(save.hchU||0,Math.min(cur+1,STAGES.length-1));else save.chU=Math.max(save.chU||0,Math.min(cur+1,STAGES.length-1));
      if(cur===STAGES.length-1){if(curH)unlock('hard');else save.beat=true;}if(cur===0)unlock('first');if(cur===2)unlock('mid');}
    if(MIS.eng==='brawl'&&MIS.boss)unlock('boss');
    persist();
    if(hpFrac>=1)unlock('flawless');if(starsEarned()>=100)unlock('hundred');let all=true;for(let c=0;c<STAGES.length&&all;c++)for(let m=0;m<mpc(c);m++)if((save.stars[mKey(c,m,false)]||0)<3){all=false;break;}if(all)unlock('stars');Native.score('spacecraft.stars',starsEarned());}
  result={win:true,stars,chal:ch,half:hpFrac>=0.5,score:Math.floor(score),t:0,endless:cur<0};scene='result';playSong('clear');if(!endless)SFX.win();}
function cpInfo(){const g=game;if(!MIS||!g)return null;
  if(g instanceof Runner&&MIS.len&&g.dist>=g.L*0.5)return {};
  if(g instanceof Space&&g.dist>=g.L*0.5)return {};
  if(g instanceof Brawl&&MIS.nw!==undefined){if(g.boss)return {boss:1};if(!g.waves.length)return null;const k=Math.ceil(g.waves.length/2);if(g.waveI>=k)return {wave:k};}
  if(g instanceof Sneak&&g.cp.y<g.cp0)return {x:g.cp.x,y:g.cp.y};
  return null;}
function stageFailed(reason){result={win:false,t:0,cp:cpInfo(),reason:reason||''};scene='result';playSong('story');SFX.lose();}
function nextAfterWin(){const i=cur,h=curH;if(curM<mpc(i)-1){startStage(i,curM+1,h);return;}const S=STAGES[i];runStory(S.post,()=>{if(i+1<STAGES.length)startStage(i+1,0,h);else runStory(ENDING,()=>{scene='title';playSong('title');},'end');});}
function uiB(id,x,y,w,h,label,col,sz){uiBtns.push({id,x,y,w,h});const hov=false;ctx.save();ctx.fillStyle=OUTC;rrect(x-3,y+3,w+6,h+6,14);ctx.fill();const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,col||'#2e7fe8');g.addColorStop(1,shade(col||'#2e7fe8'));ctx.fillStyle=g;rrect(x,y,w,h,12);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.stroke();txt(label,x+w/2,y+h/2+1,sz||26,'#fff','center',900,OUTC);ctx.restore();}
function shade(c){const n=parseInt(c.slice(1),16);const r=(n>>16)*0.6|0,g=((n>>8)&255)*0.6|0,b=(n&255)*0.6|0;return 'rgb('+r+','+g+','+b+')';}

function drawPause(){ctx.fillStyle='rgba(6,4,20,0.75)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,130,60,'#ffe14a','center',900,OUTC,true);
  uiB('resume',W/2-150,200,300,62,'RESUME','#3fa060',28);uiB('restart',W/2-150,276,300,54,'RESTART','#2e7fe8',24);uiB('quit',W/2-150,344,300,54,'QUIT TO MENU','#e8324a',24);
  const r=[['m','MUSIC',save.set.music],['s','SOUND',save.set.sfx]];r.forEach((b,i)=>uiB(b[0],W/2-150+i*155,412,145,46,b[1]+(b[2]?' ON':' OFF'),b[2]?'#5a4ab0':'#4a4a5a',18));}
function layoutTouch(){touchBtns=[];if(scene!=='play'||!game||paused)return;const ml=ML(),mr=MR();
  if(game instanceof Brawl){touchBtns.push({id:'l',x:ml+66,y:H-84,r:56,lab:'◀'},{id:'r',x:ml+190,y:H-84,r:56,lab:'▶'},{id:'k',x:W-mr-88,y:H-92,r:62,lab:'KICK'},{id:'j',x:W-mr-212,y:H-64,r:48,lab:'JUMP'},{id:'s',x:W-mr-200,y:H-186,r:46,lab:'DASH'},{id:'t',x:W-mr-84,y:H-232,r:44,lab:game.canBomb()?'BOMB':'THROW'});}
  else if(game instanceof Runner){touchBtns.push({id:'j',x:W-mr-104,y:H-104,r:76,lab:'JUMP'});if(game.hasPower)touchBtns.push({id:'s',x:ml+104,y:H-104,r:66,lab:'DASH'});}
  else if(game instanceof Mini){for(const b of game.btns())touchBtns.push(Object.assign({},b));}
  else touchBtns.push({id:'s',x:W-mr-100,y:H-100,r:66,lab:game instanceof Sneak?'DASH':'BOOST'});
  if(save.set.lefty){for(const b of touchBtns)b.x=W-b.x;const l=touchBtns.find(b=>b.id==='l'),r=touchBtns.find(b=>b.id==='r');if(l&&r){const t=l.x;l.x=r.x;r.x=t;}}
  touchBtns.push({id:'p',x:W-mr-26,y:30,r:24,lab:'II',tap:true});}
function drawTouch(){if(!touchMode)return;for(const b of touchBtns){const on=IN[b.id];if(b.id==='p'){circ(b.x,b.y,b.r,'rgba(10,6,30,0.6)');ctx.fillStyle='#fff';ctx.fillRect(b.x-7,b.y-9,5,18);ctx.fillRect(b.x+2,b.y-9,5,18);continue;}
  const hot=(b.lab==='BOMB')||(b.id==='t'&&game instanceof Brawl&&game.v==='exit'&&game.phase==='outside');
  ctx.globalAlpha=on?0.9:0.55;circ(b.x,b.y,b.r,on?'rgba(127,246,255,0.45)':'rgba(10,6,30,0.55)');ctx.lineWidth=3;ctx.strokeStyle=b.lab==='BOMB'?'#ff6a3a':'rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.stroke();
  if(hot&&b.lab==='BOMB'){ctx.globalAlpha=0.5+0.5*Math.sin(T*12);glow(b.x,b.y,b.r*1.6,'255,120,60',0.8);}ctx.globalAlpha=1;
  txt(b.lab,b.x,b.y+1,b.lab.length>2?Math.min(22,b.r*0.42):b.r*0.7,'#fff','center',900);}}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let last=performance.now();
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(scene==='play')paused=true;if(AC&&AC.state==='running')AC.suspend();}else{last=performance.now();if(AC)AC.resume();}});
playSong('title');
function update(dt){
  T+=dt;menuT+=dt;
  if(portrait)return;
  if(scene==='story'){updStory(dt);return;}
  if(scene==='play'){
    let tapPause=false;for(const tp of taps){const dx=tp.x-(W-MR()-26),dy=tp.y-30;if(dx*dx+dy*dy<40*40)tapPause=true;}
    if(paused){onUI(hitUI());if(PR.p)paused=false;return;}
    if(PR.p||tapPause){paused=true;SFX.select();return;}
    if(game)game.update(dt);return;}
  if(scene==='result'){onUI(hitUI());if(PR.ok||PR.k){onUI(result.win?'cont':result.cp?'cpretry':'retry');}return;}
  if(scene==='title'){onUI(hitUI());if(PR.ok||PR.k)onUI('play');return;}
  if(scene==='chapters'||scene==='missions'||scene==='settings'||scene==='gear'||scene==='trophies'||scene==='about'){onUI(hitUI());if(PR.p)onUI('back');return;}
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*offX,DPR*offY);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  uiBtns=[];
  if(portrait){skyGrad(['#0b0724','#160a30']);ctx.save();ctx.translate(W/2,H/2-40);ctx.rotate(Math.sin(T*2)*0.6+0.6);rrect(-40,-70,80,140,14);ctx.strokeStyle='#7ff6ff';ctx.lineWidth=6;ctx.stroke();ctx.restore();txt('Turn your device sideways',W/2,H/2+90,40,'#fff','center',900,OUTC);ctx.restore();return;}
  if(scene==='title')drawTitle();
  else if(scene==='chapters')drawChapters();
  else if(scene==='missions')drawMissions();
  else if(scene==='settings')drawSettings();
  else if(scene==='gear')drawGear();
  else if(scene==='about')drawAbout();
  else if(scene==='trophies')drawTrophies();
  else if(scene==='story')drawStory();
  else if(scene==='play'&&game){game.render();layoutTouch();drawTouch();if(paused)drawPause();}
  else if(scene==='result')drawResult();
  if(scene!=='play')touchBtns=[];
  if(FX.flash>0){ctx.fillStyle='rgba(255,255,255,'+FX.flash+')';ctx.fillRect(0,0,W,H);}
  drawToast();
  postFX();
  if(window.__shot)window.__shot();
  ctx.restore();
}
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.034);
  pollInput();musicTick();sfxPan=0;try{update(dt);}catch(e){console.error(e);}render();taps.length=0;}
requestAnimationFrame(frame);
</script>
